[package]
name = "justslide-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Thin stdio MCP transport adapter that forwards authenticated requests to a running JustSlide browser. Not a browser core."
license = "UNLICENSED"
publish = false

[lib]
path = "src/lib.rs"

[[bin]]
name = "justslide-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
libc = "0.2.191"
regex = "1.13.1"
# Server feature + stdio transport only; no HTTP/OAuth stacks are compiled in.
rmcp = { version = "=3.9.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-util", "io-std", "net", "time", "sync"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["process", "rt-multi-thread", "macros", "io-util", "net", "time", "sync"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
